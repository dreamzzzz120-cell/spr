[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
buildCommand = "npm run typecheck && npm test -- --run && npm run security:gate && npm run build"

[deploy]
startCommand = "node dist/server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Production deployment contract:
# - Node 22 is enforced by Dockerfile/Dockerfile.worker.
# - Production configuration is fail-closed in src/config.ts.
# - Shared Redis is mandatory for production rate limiting.
# - Firebase Admin and Stripe signing secrets are mandatory for the production API.
# - Migrations must complete successfully before the service starts.
#
# Required Railway Variables include:
#   NODE_ENV=production
#   APP_URL=https://<public-domain>
#   APP_ALLOWED_ORIGINS=https://<allowed-origin>[,https://<additional-origin>]
#   ENFORCE_HTTPS=true
#   TRUST_PROXY=true
#   FIREBASE_SERVICE_ACCOUNT_KEY (or GOOGLE_APPLICATION_CREDENTIALS)
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
#   REDIS_URL
#   DATABASE_URL (or complete SQL_* alternative)
#   RATE_LIMIT_FAIL_OPEN=false
#
# Optional:
#   GEMINI_API_KEY
#   SENTRY_DSN
#
# The worker is a separate Railway service pointed at Dockerfile.worker and must
# receive the database/Firebase/Redis configuration it actually needs.
