name: Security Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

  application-security:
    name: Application Security Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d spr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test -- --run
      - name: Security attack regressions
        run: npm run test:security
      - name: Live unauthenticated route attack test
        run: npm run route:attack
      - name: Migration and route security gates
        run: npm run security:gate
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Database migration integration test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/spr_test
        run: |
          npx tsx scripts/migrate.ts
          npx tsx scripts/migrate.ts
          test "$(psql "$DATABASE_URL" -Atc 'SELECT count(*) FROM schema_migrations')" = "8"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM users LIMIT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM trust_observations LIMIT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM remediation_tasks LIMIT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM remediation_verifications LIMIT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM ai_agent_trust_agents LIMIT 1"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM ai_agent_trust_events LIMIT 1"
      - name: Check for committed private-key material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI --exclude='*.lock' --exclude-dir=node_modules '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' -- ':!*.md'; then
            echo 'Private-key material detected in tracked source files.'
            exit 1
          fi
