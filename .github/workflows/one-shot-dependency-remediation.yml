name: One-shot dependency remediation

on:
  push:
    branches:
      - hardening/never-break

permissions:
  contents: write

concurrency:
  group: one-shot-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hardening/never-break
          persist-credentials: true

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Pin patched qs transitive dependency
        run: |
          npm pkg set overrides.qs=6.16.0
          npm install --package-lock-only

      - name: Apply npm security fixes
        shell: bash
        run: |
          npm audit fix || true

      - name: Verify no high or critical advisories remain
        run: npm audit --audit-level=high

      - name: Verify lockfile install
        run: npm ci

      - name: Commit dependency remediation
        shell: bash
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'No dependency changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'security: remediate npm audit findings'
          git push origin HEAD:hardening/never-break
